name: 'Terraform'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  TF_VERSION: '1.5.0'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format
      id: fmt
      run: terraform fmt -check

    - name: Terraform Init
      id: init
      run: terraform init
      env:
        AWS_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

    - name: Terraform Validate
      id: validate
      run: terraform validate -no-color

    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request'
      run: terraform plan -no-color -input=false
      env:
        TF_VAR_yandex_cloud_id: ${{ vars.YC_CLOUD_ID }}
        TF_VAR_yandex_folder_id: ${{ vars.YC_FOLDER_ID }}
        TF_VAR_yandex_token: ${{ secrets.YC_TOKEN }}
        TF_VAR_s3_access_key: ${{ vars.S3_ACCESS_KEY }}
        TF_VAR_s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
        AWS_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

    - name: Terraform Plan Status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const output = `#### Terraform Format and Style \`${{ steps.fmt.outputs.exit-code }}\`
          #### Terraform Initialization \`${{ steps.init.outputs.exit-code }}\`
          #### Terraform Validation \`${{ steps.validate.outputs.exit-code }}\`
          #### Terraform Plan \`${{ steps.plan.outputs.exit-code }}\`
          <details><summary>Show Plan</summary>
          \`\`\`\n
          ${{ steps.plan.outputs.stdout }}
          \`\`\`
          </details>`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false
      env:
        TF_VAR_yandex_cloud_id: ${{ vars.YC_CLOUD_ID }}
        TF_VAR_yandex_folder_id: ${{ vars.YC_FOLDER_ID }}
        TF_VAR_yandex_token: ${{ secrets.YC_TOKEN }}
        TF_VAR_s3_access_key: ${{ vars.S3_ACCESS_KEY }}
        TF_VAR_s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
        AWS_ACCESS_KEY_ID: ${{ vars.S3_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}